name: Apply V5 quality correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: finalize V5 hydro quality logic') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V5 quality rules
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          route = Path('app/api/reports/export-v5/route.ts')
          s = route.read_text(encoding='utf-8')

          new_quality = r'''function quality(rows: HydroRow[], module: Hydro) {
            const cfg = CFG[module];
            // A duplicate is an exact repeated observation, not merely a repeated value.
            // Same station/date with different hours is normal (morning/evening), and a
            // stable piezometric level may legitimately repeat for days or weeks.
            const exactCounts = new Map<string, number>();
            const sameObservationCounts = new Map<string, number>();
            for (const r of rows) {
              const code = text(r.code_site || r.code_station || r.code_piezo);
              const d = dateText(r.date_observation);
              const h = observationHour(r);
              const value = number(r[cfg.value]);
              const identity = `${code}|${d}|${h}|${value === null ? "" : value}`;
              const slot = `${code}|${d}|${h}`;
              exactCounts.set(identity, (exactCounts.get(identity) || 0) + 1);
              sameObservationCounts.set(slot, (sameObservationCounts.get(slot) || 0) + 1);
            }

            const values = rows.map(r => number(r[cfg.value])).filter((x): x is number => x !== null).sort((a, b) => a - b);
            const quartile = (p: number) => values[Math.floor((values.length - 1) * p)];
            const bounds = values.length >= 4 ? (() => {
              const q1 = quartile(.25), q3 = quartile(.75), iqr = q3 - q1;
              return { lo: q1 - 1.5 * iqr, hi: q3 + 1.5 * iqr };
            })() : null;
            const today = new Date().toISOString().slice(0, 10);
            const seenExact = new Set<string>();

            return rows.map((r: any) => {
              const code = text(r.code_site || r.code_station || r.code_piezo);
              const d = dateText(r.date_observation);
              const h = observationHour(r);
              const value = number(r[cfg.value]);
              const identity = `${code}|${d}|${h}|${value === null ? "" : value}`;
              const slot = `${code}|${d}|${h}`;
              const exactRepeat = exactCounts.get(identity)! > 1 && seenExact.has(identity);
              seenExact.add(identity);

              // Missing time on limnimetry is not enough to reject a record. Multiple
              // readings on the same day without time are retained and simply flagged.
              const sameDayNoHour = module === "limnimetrie" && !h &&
                rows.filter(x => text(x.code_site || x.code_station || x.code_piezo) === code && dateText(x.date_observation) === d).length > 1;
              const sameSlotMultiple = sameObservationCounts.get(slot)! > 1;
              const incomplete = !code || !validDate(d) || value === null;
              const atypical = !!(bounds && value !== null && (value < bounds.lo || value > bounds.hi));
              const future = validDate(d) && d > today;
              const gpsBad = !gpsValid(r);

              let status = "Validée";
              if (exactRepeat) status = "Doublon";
              else if (incomplete || future) status = "Rejetée";
              else if (gpsBad || atypical || sameDayNoHour || (sameSlotMultiple && !exactRepeat)) status = "À vérifier";

              // GPS quality affects cartographic placement, not the hydro measurement
              // itself. A technically complete observation therefore remains analytic.
              const usable = !incomplete && !future && !exactRepeat;

              return {
                ...r,
                __status: status,
                __duplicate: exactRepeat,
                __usable: usable,
                __atypical: atypical,
                __future: future,
                __gpsBad: gpsBad,
                __fewDailyMeasurements: sameDayNoHour,
              };
            });
          }
          '''

          s, n = re.subn(r'function quality\(rows: HydroRow\[\], module: Hydro\) \{.*?\n\}\n\nfunction qualitySummary', new_quality + '\nfunction qualitySummary', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'quality block replacement failed: {n}')

          s = s.replace('rows.filter(x => x.__status === "Validée")', 'rows.filter(x => x.__usable)')
          s = s.replace('rows.filter(r => r.__status === "Validée")', 'rows.filter(r => r.__usable)')

          old_summary = '''function qualitySummary(rows: any[], loaderRejected = 0) {
            return {
              total: rows.length + loaderRejected,
              loaded: rows.length,
              valid: rows.filter(r => r.__status === "Validée").length,
              verify: rows.filter(r => r.__status === "À vérifier").length,
              rejected: rows.filter(r => r.__status === "Rejetée").length + loaderRejected,
              duplicates: rows.filter(r => r.__duplicate).length,
              atypical: rows.filter(r => r.__atypical).length,
              gps: rows.filter(r => r.__gpsBad).length,
              future: rows.filter(r => r.__future).length,
              missingHourReview: rows.filter(r => r.__fewDailyMeasurements).length,
            };
          }'''
          new_summary = '''function qualitySummary(rows: any[], loaderRejected = 0) {
            return {
              total: rows.length + loaderRejected,
              loaded: rows.length,
              valid: rows.filter(r => r.__status === "Validée").length,
              usable: rows.filter(r => r.__usable).length,
              verify: rows.filter(r => r.__status === "À vérifier").length,
              rejected: rows.filter(r => r.__status === "Rejetée").length + loaderRejected,
              duplicates: rows.filter(r => r.__duplicate).length,
              atypical: rows.filter(r => r.__atypical).length,
              gps: rows.filter(r => r.__gpsBad).length,
              future: rows.filter(r => r.__future).length,
              missingHourReview: rows.filter(r => r.__fewDailyMeasurements).length,
            };
          }'''
          if old_summary not in s:
              raise SystemExit('qualitySummary exact block not found')
          s = s.replace(old_summary, new_summary, 1)

          s = s.replace('"Doublon certain": r.__duplicate ? "Oui" : "Non",', '"Doublon exact": r.__duplicate ? "Oui" : "Non",\n    "Utilisable pour analyse": r.__usable ? "Oui" : "Non",')
          s = s.replace('Aucune donnée validée', 'Aucune donnée utilisable')
          s = s.replace('seules les données validées alimentent les indicateurs.', 'toutes les données techniquement utilisables alimentent les indicateurs ; les doublons exacts et données structurellement invalides sont exclus.')
          s = s.replace('doublons certains', 'doublons exacts')
          route.write_text(s, encoding='utf-8')

          panel = Path('components/reports/ReportsPanel.tsx')
          if panel.exists():
              t = panel.read_text(encoding='utf-8')
              t = t.replace('Doublon certain selon le module', 'Doublon exact selon le module')
              t = t.replace('Doublon certain', 'Doublon exact')
              panel.write_text(t, encoding='utf-8')
          PY

      - name: Verify source changes
        run: |
          grep -q 'const exactCounts' app/api/reports/export-v5/route.ts
          grep -q '__usable' app/api/reports/export-v5/route.ts
          grep -q 'Utilisable pour analyse' app/api/reports/export-v5/route.ts
          grep -q 'rows.filter(x => x.__usable)' app/api/reports/export-v5/route.ts

      - name: Commit corrected V5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/reports/export-v5/route.ts components/reports/ReportsPanel.tsx
          git commit -m 'fix: finalize V5 hydro quality logic'
          git push

      - name: Remove one-shot workflow
        if: success()
        run: |
          git rm .github/workflows/apply-v5-quality-fix.yml
          git commit -m 'chore: remove one-shot V5 quality workflow'
          git push
